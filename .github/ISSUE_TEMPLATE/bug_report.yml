name: 问题反馈
description: 报告 AI8.MY 客户端问题
body:
  - type: markdown
    attributes:
      value: 请勿提交密码、API Key、登录凭据或私密项目内容。
  - type: input
    id: version
    attributes:
      label: AI8.MY 版本
      placeholder: 例如 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 已脱敏的错误信息
